name: Node.js CI

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Install backend dependencies
      - name: Install Backend Dependencies
        run: npm ci

      # Create .env
      - name: Create .env file safely
        run: |
          rm -f .env
          printf "%s" "${{ secrets.PROD_ENV_FILE }}" > .env
          chmod 600 .env
          echo ".env file created"

      - name: Install PM2
        run: npm install -g pm2

      - name: Add Node & PM2 to PATH
        run: echo "/home/nodeteam/.local/share/fnm/node-versions/v22.21.1/installation/bin" >> $GITHUB_PATH

      # Restart backend
      - name: Restart backend with PM2
        run: |
          pm2 restart hrms-backend --update-env || pm2 start src/server.js --name hrms-backend
          pm2 save
